<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lights Out</title><style>
*{box-sizing:border-box}body{margin:0;background:#101217;color:#f4f4f5;font:16px system-ui,sans-serif}main{max-width:620px;margin:auto;padding:24px 16px}h1{font-size:44px;font-style:italic;letter-spacing:-2px;margin:0;color:#ff3348}small{color:#a8abb5;letter-spacing:1px}hr{border:0;height:5px;background:repeating-linear-gradient(90deg,#eee 0 14px,#444 14px 28px);margin:22px 0}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:1px solid #41444e;border-radius:9px;background:#242730;padding:12px}button.selected{border-color:#ff3348;background:#49232c}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.grid button{padding:12px 2px;font-size:14px}.gantry{display:flex;gap:6px;width:100%;background:#08090b;padding:12px 7px;touch-action:none}.housing{flex:1;min-width:0;background:#22242a;padding:6px 4px;border-radius:8px;display:grid;gap:7px}.lamp{aspect-ratio:1;border-radius:50%;background:#351018;border:3px solid #08090b}.red .lamp{background:#ff1734;box-shadow:0 0 14px #ff173488}#action{width:100%;margin:14px 0;background:#d91c35;font-weight:800;padding:20px;touch-action:none}#action.wait{background:#292c34}#status{text-align:center;min-height:48px;display:grid;place-items:center;font-weight:700}.rounds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.tile,.average{background:#22252d;border-radius:8px;text-align:center;padding:14px 4px}.tile strong{display:block;margin-top:8px;font-size:22px}.average strong{display:block;font-size:42px}.average{border-left:3px solid #ff3348}#filters{display:flex;gap:5px;flex-wrap:wrap}#filters button{font-size:12px;padding:8px}.record{display:flex;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid #353741}.record b{margin-left:auto}#reset{display:block;margin:12px auto;font-size:12px}h2{font-style:italic}p{color:#a8abb5;font-size:13px}button:focus-visible{outline:2px solid white}strong,b{font-variant-numeric:tabular-nums}
.grid button .face{display:block;font-size:32px;margin-bottom:5px}#sound{float:right;font-size:12px;padding:8px;margin-top:6px}</style><main><button id="sound"></button><h1>LIGHTS OUT</h1><small>FAMILY GRAND PRIX</small><hr><form id="login"><input id="pin" type="password" inputmode="numeric" maxlength="5" required placeholder="Family PIN"><button>Enter</button></form><section id="game" hidden><div class="grid" id="drivers"></div><p id="status"></p><button id="start" hidden>START RACE</button><button id="lights" class="gantry"></button><button id="action" disabled>WAIT</button><div id="board"></div><hr><h2>🏆 Top 5 records</h2><div id="filters"></div><div id="records"></div><button id="reset" hidden>NEW RACE</button></section><p id="error"></p><p>Audio: <a href="https://freesound.org/people/rfhache/sounds/60051/">F1 BR 06 race start by rfhache</a> · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></p></main><script>
const $=id=>document.getElementById(id),names=['Daddy','Mummy','Amberley','Auden'],faces={Daddy:'👨',Mummy:'👩',Amberley:'👧',Auden:'👦'};
let sound=true,ctx,engine=null,buffers=null,loading=null;
try{sound=localStorage.getItem('lights-out-sound')!=='off'}catch{}
function soundLabel(){$('sound').textContent=sound?'🔊 Sound on':'🔇 Sound off';$('sound').setAttribute('aria-pressed',String(sound))}
function stopEngine(){if(engine){try{engine.stop()}catch{}engine=null}}
function loadAudio(){if(buffers)return Promise.resolve();if(loading)return loading;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();loading=Promise.all(['revving-stitched.mp3','launch.mp3'].map(async p=>{const r=await fetch(p);if(!r.ok)throw Error(p);return ctx.decodeAudioData(await r.arrayBuffer())})).then(b=>{buffers=b}).catch(e=>{loading=null;throw e});return loading}catch(e){return Promise.reject(e)}}
function playClip(i,loop){stopEngine();if(!sound||!buffers||ctx.state!=='running')return;const s=ctx.createBufferSource();s.buffer=buffers[i];s.loop=loop;s.connect(ctx.destination);s.start();engine=s;s.onended=()=>{if(engine===s)engine=null}}
function startEngine(){playClip(0,false)}
function rev(n){}
function launchSound(){playClip(1,false)}
$('sound').onclick=()=>{sound=!sound;try{localStorage.setItem('lights-out-sound',sound?'on':'off')}catch{}if(!sound)stopEngine();else loadAudio().catch(()=>{});soundLabel()};soundLabel();loadAudio().catch(()=>{});

const endpoint='https://wmxcrqceoeoyxxoxrmpb.supabase.co/functions/v1/multiplayer';let recordFilter='All';let token=localStorage.getItem('lights-out-token')||'',state=null,offset=0,best=Infinity,busy=false,roundKey='',tapped=false,go=null,engineStarted=false;
$('lights').innerHTML=Array.from({length:5},()=>'<span class="housing"><span class="lamp"></span><span class="lamp"></span></span>').join('');
function lights(n){Array.from($('lights').children).forEach((el,i)=>el.classList.toggle('red',i<n))}
async function api(action,extra={}){const a=performance.now();const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,...extra})});const b=await r.json();if(!r.ok)throw Error(b.error||'Connection failed');const z=performance.now();if(b.now&&z-a<best){best=z-a;offset=b.now-(a+z)/2}return b}
async function send(action,extra={}){if(busy)return;busy=true;try{const b=await api(action,extra);state=b;$('login').hidden=true;$('game').hidden=false;$('error').textContent='';render()}catch(e){$('error').textContent=e.message}finally{busy=false}}
$('login').onsubmit=async e=>{e.preventDefault();try{const b=await api('login',{pin:$('pin').value});token=b.token;localStorage.setItem('lights-out-token',token);$('pin').value='';best=Infinity;send('state')}catch(e){$('error').textContent=e.message}};
function render(){if(!state)return; $('filters').replaceChildren();for(const n of ['All',...names]){const b=document.createElement('button');b.textContent=n;b.classList.toggle('selected',n===recordFilter);b.onclick=()=>{recordFilter=n;render()};$('filters').append(b)}$('records').replaceChildren();const records=(state.records||[]).filter(r=>recordFilter==='All'||r.player===recordFilter).sort((a,b)=>Number(a.average_ms)-Number(b.average_ms)).slice(0,5);if(!records.length)$('records').textContent='No qualifying records yet.';for(const [i,r] of records.entries()){const d=document.createElement('div');d.className='record';d.textContent='P'+(i+1)+' '+r.player+' · '+[r.r1,r.r2,r.r3].join(' / ')+' ms · '+Math.round(r.average_ms)+' ms';$('records').append(d)}const s=state;const k=s.race+':'+s.round;if(k!==roundKey){roundKey=k;tapped=false;go=null;engineStarted=false;stopEngine()}if(s.results[s.round+':'+s.me]!==undefined)tapped=true;$('drivers').replaceChildren();for(const n of names){const b=document.createElement('button');b.textContent=faces[n]+' '+n+(s.players.includes(n)?' ✓':'');b.disabled=s.round!==0||(s.players.includes(n)&&s.me!==n);b.classList.toggle('selected',s.me===n);b.onclick=()=>{loadAudio().then(()=>ctx.resume()).catch(()=>{});send('join',{player:n})};$('drivers').append(b)}$('start').hidden=!(s.round===0&&s.me==='Daddy'&&s.players.length===4);$('reset').hidden=!(s.me==='Daddy'&&(s.round===4||s.round===0));$('board').replaceChildren();const rows=names.map(n=>{const v=[1,2,3].map(i=>s.results[i+':'+n]);const valid=v.filter(x=>x>=0);return {n,v,count:valid.length,avg:valid.length?valid.reduce((a,b)=>a+b,0)/valid.length:Infinity}});if(s.round===4)rows.sort((a,b)=>(b.count===3)-(a.count===3)||(a.count===3&&b.count===3?a.avg-b.avg:0));for(const [i,r] of rows.entries()){const d=document.createElement('div');d.className='record';d.textContent=(s.round===4?(r.count===3?'P'+(i+1)+' ':'DSQ '):'')+r.n+' · '+r.v.map((v,j)=>s.round!==4&&j+1>=s.round?'—':v===undefined?'—':v<0?'DSQ':v+' ms').join(' / ')+(s.round===4?(r.count===3?' · Avg '+Math.round(r.avg)+' ms':' · Overall DSQ'):'');$('board').append(d)}}
$('start').onclick=()=>send('start');$('reset').onclick=()=>send('reset');
function tick(){requestAnimationFrame(tick);if(!state)return;const s=state,t=performance.now()+offset;let label='WAIT',status='';if(s.round===0){lights(0);status='Waiting for all four drivers ('+s.players.length+'/4)'}else if(s.round===4){lights(0);status='CHEQUERED FLAG — final standings'}else{const active=t>=s.start;const n=active&&t<s.off?Math.min(5,Math.floor((t-s.start)/1000)):0;lights(n);if(active&&!engineStarted&&t<s.off){engineStarted=true;startEngine()}if(t>=s.off&&go===null){go=performance.now();if(!tapped)launchSound()}status='ROUND '+s.round+' OF 3 — '+(!active?'Get ready':tapped?'Result locked':t<s.off?'Watch the lights':'LIGHTS OUT!');label=tapped?'LOCKED':!active?'GET READY':t<s.off?'WAIT':'TAP NOW'}$('status').textContent=status;$('action').textContent=label;$('action').disabled=!(s.me&&s.round>=1&&s.round<=3&&t>=s.start&&!tapped)}
async function tap(e){if(e.type==='pointerdown'){if(!e.isPrimary||e.button!==0)return;e.preventDefault()}if(!state||!state.me||tapped||state.round<1||state.round>3||performance.now()+offset<state.start)return;const ms=go===null?-1:Math.max(0,Math.round(performance.now()-go));tapped=true;const payload={player:state.me,round:state.round,race:state.race,ms};try{state=await api('tap',payload);render()}catch(err){$('error').textContent='Submission failed — round locked locally';}}
for(const id of ['lights','action']){$(id).addEventListener('pointerdown',tap);$(id).addEventListener('click',e=>{if(e.detail===0)tap(e)})}if(token)send('state');setInterval(()=>{if(token)send('state')},500);tick();
</script></html>
